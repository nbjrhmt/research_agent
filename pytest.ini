# pytest 配置 —— 离线单元测试(不调用 LLM/搜索 API)
#
# 约定:
#   - 只收集 tests/ 下 test_*.py: tests/_e2e_test.py(真实消耗 API 额度)与
#     tests/test_search.py(联网冒烟)不会进入 CI 自动执行;
#   - 运行: python -m pytest tests
[pytest]
testpaths = tests
python_files = test_*.py
# -p no:cacheprovider: 不写 .pytest_cache(CI 只读环境/沙盒更干净, 缓存对本次无收益)
addopts = -ra -p no:cacheprovider
